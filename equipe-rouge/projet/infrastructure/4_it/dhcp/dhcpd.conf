default-lease-time 600;
max-lease-time 7200;
authoritative;

option domain-name-servers 192.168.2.5;

# prod @192.168.2.32/27
subnet 192.168.2.32 netmask 255.255.255.224 {
    range 192.168.2.35 192.168.2.62;
    option routers 192.168.2.33;
    option broadcast-address 192.168.2.63;
}

# admin @192.168.2.64/27
subnet 192.168.2.64 netmask 255.255.255.224 {
    range 192.168.2.67 192.168.2.94;
    option routers 192.168.2.65;
    option broadcast-address 192.168.2.95;
}

# it @192.168.2.96/27
# 99-102 reserved for services
subnet 192.168.2.96 netmask 255.255.255.224 {
    range 192.168.2.103 192.168.2.126;
    option routers 192.168.2.97;
    option broadcast-address 192.168.2.127;
}